<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>贪吃蛇 · 阶段二（难度选择 + AI 自动演示）</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;
    background:#0f1115;color:#e6e6e6;
    font-family:"Microsoft YaHei","WenQuanYi Micro Hei",sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;
  }
  h1{font-size:20px;margin:0 0 14px;letter-spacing:1px}

  .wrap{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
  canvas{background:#0b0d12;border:1px solid #2a2f3a;border-radius:8px;display:block}

  .panel{
    width:240px;background:#171a21;border:1px solid #2a2f3a;
    border-radius:8px;padding:16px;
  }
  .row{display:flex;justify-content:space-between;font-size:14px;margin-bottom:10px}
  .row .val{color:#4ade80;font-weight:bold}

  button{
    width:100%;padding:9px;margin-bottom:8px;cursor:pointer;
    background:#2a2f3a;color:#e6e6e6;border:1px solid #3a4050;border-radius:6px;font-size:14px;
    transition:background .15s,border-color .15s;
  }
  button:hover{background:#343a48}

  .btn-ai{
    background:#1a3a2a;border-color:#2d5a3d;color:#4ade80;font-weight:bold;
  }
  .btn-ai:hover{background:#23402e}
  .btn-ai.active{
    background:#4ade80;color:#0f1115;border-color:#4ade80;
  }
  .btn-ai.active:hover{background:#3cc96e}

  .tip{font-size:12px;color:#8b93a7;line-height:1.9;margin-top:10px}
  .tip b{color:#e6e6e6}

  .board{position:relative}
  .mask{
    position:absolute;inset:0;display:none;
    background:rgba(10,12,16,.82);border-radius:8px;
    flex-direction:column;align-items:center;justify-content:center;
  }
  .mask.show{display:flex}
  .mask .big{font-size:22px;font-weight:bold;color:#f87171;margin-bottom:6px}
  .mask .small{font-size:13px;color:#9aa3b5}

  .ai-progress{
    background:#1a231e;border:1px solid #2d5a3d;border-radius:6px;
    padding:10px 12px;margin-bottom:12px;
  }
  .ai-progress .label{font-size:12px;color:#8b93a7;margin-bottom:4px}
  .ai-progress .value{font-size:18px;font-weight:bold;color:#4ade80}
  .ai-progress .bar-bg{
    width:100%;height:6px;background:#2a2f3a;border-radius:3px;margin-top:6px;
  }
  .ai-progress .bar-fill{
    height:100%;background:#4ade80;border-radius:3px;transition:width .2s;
  }
  .ai-progress .done{color:#fbbf24;font-size:12px;margin-top:4px}

  .diff-row{display:flex;gap:4px;margin-bottom:12px}
  .diff-btn{
    flex:1;padding:6px 0;cursor:pointer;font-size:12px;
    background:#2a2f3a;color:#8b93a7;border:1px solid #3a4050;border-radius:5px;
    transition:all .15s;
  }
  .diff-btn:hover{background:#343a48;color:#e6e6e6}
  .diff-btn.active{background:#1a3a2a;border-color:#2d5a3d;color:#4ade80;font-weight:bold}
  .diff-btn.disabled{opacity:.4;pointer-events:none}
</style>
</head>
<body>

<h1>🐍 贪吃蛇 · 阶段二（难度选择 + 手动 + AI）</h1>

<div class="wrap">
  <div class="board">
    <canvas id="cv" width="400" height="400"></canvas>
    <div class="mask" id="mask">
      <div class="big" id="maskTitle">游戏结束</div>
      <div class="small" id="maskText">点击"重新开始"再来一局</div>
    </div>
  </div>

  <div class="panel">
    <div class="row"><span>当前分数</span><span class="val" id="score">0</span></div>
    <div class="row"><span>已吃食物</span><span class="val" id="eaten">0</span></div>
    <div class="row"><span>蛇身长度</span><span class="val" id="len">3</span></div>
    <div class="row"><span>最高分</span><span class="val" id="best">0</span></div>
    <div class="row"><span>状态</span><span class="val" id="state">待开始</span></div>

    <div class="row"><span>当前速度</span><span class="val" id="speed">120ms</span></div>

    <hr style="border:none;border-top:1px solid #2a2f3a;margin:14px 0">

    <div class="diff-row" id="diffRow">
      <button class="diff-btn" data-diff="easy">🟢 简单</button>
      <button class="diff-btn active" data-diff="normal">🟡 普通</button>
      <button class="diff-btn" data-diff="hard">🟠 困难</button>
      <button class="diff-btn" data-diff="hell">🔴 地狱</button>
    </div>

    <button id="btnStart">开始 / 暂停</button>
    <button id="btnReset">重新开始</button>
    <button id="btnAI" class="btn-ai">🤖 AI 自动演示</button>

    <div class="ai-progress" id="aiBox">
      <div class="label">🤖 AI 本轮已吃</div>
      <div class="value"><span id="aiEaten">0</span> / <span id="aiTarget">15</span></div>
      <div class="bar-bg"><div class="bar-fill" id="aiBar" style="width:0%"></div></div>
      <div class="done" id="aiDone"></div>
    </div>

    <div class="tip">
      <div>🎮 <b>方向键</b> 或 <b>WASD</b> 控制方向</div>
      <div>⏸ <b>空格</b> 开始 / 暂停</div>
      <div>⚡ 上方选择难度，越难速度越快、分数倍率越高</div>
      <div>⏩ 每吃 5 个食物，蛇自动加速</div>
      <div>🧱 <b>蛇短时</b>（&lt; 8 节）场上会出现障碍物，碰到蛇变短</div>
      <div>🤖 <b>AI 演示</b> 自动寻路吃食物</div>
      <div>🎯 AI 目标：连续吃完 <b>15</b> 个食物不死</div>
      <div>❌ <b>撞墙</b> 或 <b>撞到自己</b> 即结束</div>
      <div>🍎 吃一个食物 <b>+10 分</b>（× 难度倍率），蛇身变长 1 节</div>
    </div>
  </div>
</div>

<script>
/* ==========================================================================
   贪吃蛇 阶段二：手动模式 + AI 自动演示
   —— 纯 HTML + CSS + JavaScript，不依赖任何外部库
   AI 策略：BFS 最短路径 + 安全性模拟 + 追尾保命
   ========================================================================== */

/* ---------- 1. 基础常量 ---------- */
const COLS = 20;
const ROWS = 20;
const CELL = 20;

const cv  = document.getElementById('cv');
const ctx = cv.getContext('2d');
const $   = id => document.getElementById(id);

/* ---------- 2. 颜色主题 ---------- */
const COLOR = {
  bg:    '#0b0d12',
  grid:  '#13161d',
  snake: '#4ade80',
  head:  '#22c55e',
  food:  '#f87171',
  wall:  '#3a3050'      // 障碍物颜色
};

/* ---------- 2.5 难度配置 ---------- */
const DIFFICULTY = {
  easy:   { label: '简单', speed: 160, multiplier: 0.8, emoji: '🟢' },
  normal: { label: '普通', speed: 120, multiplier: 1.0, emoji: '🟡' },
  hard:   { label: '困难', speed:  80, multiplier: 1.5, emoji: '🟠' },
  hell:   { label: '地狱', speed:  50, multiplier: 2.0, emoji: '🔴' }
};
const SPEED_ACCEL   = 5;      // 每吃 5 个食物，速度加快 5ms
const SPEED_MIN     = 30;     // 速度下限（ms）
const OBSTACLE_COUNT = 3;     // 障碍物数量
const OBSTACLE_MAX_LEN = 8;  // 蛇长 ≥ 此值后清除障碍物
const OBSTACLE_SHRINK = 2;   // 碰到障碍物缩短的节数
const OBSTACLE_PENALTY = 10; // 碰到障碍物扣分

/* ---------- 3. 游戏状态变量 ---------- */
let snake    = [];
let dir      = {};
let nextDir  = {};
let food     = {};
let score    = 0;
let eaten    = 0;
let alive    = true;
let running  = false;
let timer    = null;
let best     = Number(localStorage.getItem('snake_best_normal') || 0);

/* ---------- 3.5 AI 状态变量 ---------- */
let aiMode         = false;  // AI 模式开关
const AI_TARGET    = 15;     // AI 目标：连续吃完 15 个食物
let aiEatenThisRun = 0;      // AI 本轮连续吃掉的食物数
let aiReachedGoal  = false;  // AI 已达成 15 目标
let aiStepsNoFood  = 0;      // AI 连续多少步没吃到食物（死锁检测）
const AI_SPEED     = 70;     // AI 模式每步间隔（毫秒）
const AI_STARVE_LIMIT = 350; // 连续 350 步没吃到食物 → 启动饥饿模式

/* ---------- 3.6 手动模式增强变量 ---------- */
let currentDiff = 'normal';               // 当前难度
let obstacles   = [];                      // 障碍物数组
let currentSpeed = DIFFICULTY.normal.speed; // 当前实际速度（会渐进加速）

/* ---------- 4. 小工具函数 ---------- */
const key    = p => p.x + ',' + p.y;
const eq     = (a, b) => a.x === b.x && a.y === b.y;
const inside = p => p.x >= 0 && p.x < COLS && p.y >= 0 && p.y < ROWS;

/* ---------- 5. 随机生成食物 ---------- */
function makeFood() {
  const occupied = new Set([...snake.map(key), ...obstacles.map(key)]);
  const free = [];
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      if (!occupied.has(x + ',' + y)) free.push({ x, y });
    }
  }
  if (free.length === 0) return null;
  return free[Math.floor(Math.random() * free.length)];
}

/* ---------- 5.5 生成障碍物 ---------- */
function generateObstacles() {
  obstacles = [];
  if (aiMode || snake.length >= OBSTACLE_MAX_LEN) return;
  const forbidden = new Set([...snake.map(key), key(food)]);
  let tries = 0;
  while (obstacles.length < OBSTACLE_COUNT && tries < 200) {
    tries++;
    const p = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
    if (!forbidden.has(key(p))) {
      obstacles.push(p);
      forbidden.add(key(p));
    }
  }
}

/* ---------- 6. 初始化 / 重置一局 ---------- */
function reset() {
  snake    = [{ x:10, y:10 }, { x:9, y:10 }, { x:8, y:10 }];
  dir      = { x:1, y:0 };
  nextDir  = { x:1, y:0 };
  currentSpeed = DIFFICULTY[currentDiff].speed;
  generateObstacles();
  food     = makeFood();
  score    = 0;
  eaten    = 0;
  alive    = true;
  running  = false;
  aiEatenThisRun = 0;
  aiReachedGoal  = false;
  aiStepsNoFood  = 0;
  best = Number(localStorage.getItem('snake_best_' + currentDiff) || 0);
  stop();
  $('mask').classList.remove('show');
  updateHUD();
  updateAIHUD();
  draw();
  setState('待开始');
}

/* ---------- 7. 画棋盘 ---------- */
function draw() {
  ctx.fillStyle = COLOR.bg;
  ctx.fillRect(0, 0, cv.width, cv.height);

  ctx.strokeStyle = COLOR.grid;
  ctx.lineWidth = 1;
  for (let i = 0; i <= COLS; i++) {
    ctx.beginPath(); ctx.moveTo(i*CELL, 0); ctx.lineTo(i*CELL, cv.height); ctx.stroke();
  }
  for (let i = 0; i <= ROWS; i++) {
    ctx.beginPath(); ctx.moveTo(0, i*CELL); ctx.lineTo(cv.width, i*CELL); ctx.stroke();
  }

  if (food) {
    ctx.fillStyle = COLOR.food;
    ctx.beginPath();
    ctx.arc(food.x*CELL + CELL/2, food.y*CELL + CELL/2, CELL/2 - 3, 0, Math.PI*2);
    ctx.fill();
  }

  // 障碍物
  obstacles.forEach(o => {
    ctx.fillStyle = COLOR.wall;
    ctx.fillRect(o.x*CELL + 2, o.y*CELL + 2, CELL - 4, CELL - 4);
    // 画叉号
    ctx.strokeStyle = '#6b5b7a';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(o.x*CELL + 5, o.y*CELL + 5);
    ctx.lineTo(o.x*CELL + CELL - 5, o.y*CELL + CELL - 5);
    ctx.moveTo(o.x*CELL + CELL - 5, o.y*CELL + 5);
    ctx.lineTo(o.x*CELL + 5, o.y*CELL + CELL - 5);
    ctx.stroke();
  });

  snake.forEach((s, i) => {
    ctx.fillStyle = (i === 0) ? COLOR.head : COLOR.snake;
    ctx.fillRect(s.x*CELL + 1, s.y*CELL + 1, CELL - 2, CELL - 2);
  });
}

/* ---------- 8. 走一步（核心逻辑） ---------- */
function step() {
  dir = nextDir;

  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  if (!inside(head)) return gameOver('撞到墙了');

  const body = snake.slice(0, -1);
  if (body.some(s => eq(s, head))) return gameOver('撞到自己了');

  // 障碍物碰撞检测（手动模式）
  const hitObs = obstacles.find(o => eq(head, o));
  if (hitObs && !aiMode) {
    score = Math.max(0, score - OBSTACLE_PENALTY);
    // 蛇变短
    const shrink = Math.min(OBSTACLE_SHRINK, snake.length - 1);
    for (let i = 0; i < shrink; i++) snake.pop();
    // 移除被碰到的障碍物
    obstacles = obstacles.filter(o => o !== hitObs);
    // 蛇变短后检查是否该清除所有障碍物
    if (snake.length >= OBSTACLE_MAX_LEN) obstacles = [];
    updateHUD();
    draw();
    return; // 碰障碍物不移动蛇头，在原地缩短
  }

  snake.unshift(head);

  if (eq(head, food)) {
    const mult = aiMode ? 1 : DIFFICULTY[currentDiff].multiplier;
    const points = Math.round(10 * mult);
    score += points;
    eaten += 1;
    aiEatenThisRun += 1;
    aiStepsNoFood = 0;
    if (!aiReachedGoal && aiEatenThisRun >= AI_TARGET) {
      aiReachedGoal = true;
    }
    if (score > best) {
      best = score;
      localStorage.setItem('snake_best_' + currentDiff, best);
    }

    // 渐进加速（手动模式）
    if (!aiMode) {
      const baseSpeed = DIFFICULTY[currentDiff].speed;
      const accelSteps = Math.floor(eaten / SPEED_ACCEL);
      const newSpeed = Math.max(SPEED_MIN, baseSpeed - accelSteps * SPEED_ACCEL);
      if (newSpeed !== currentSpeed) {
        currentSpeed = newSpeed;
        setTimerSpeed(currentSpeed);
      }
      // 吃食物后重检障碍物
      if (snake.length >= OBSTACLE_MAX_LEN) obstacles = [];
      else if (obstacles.length === 0 && snake.length < OBSTACLE_MAX_LEN) {
        generateObstacles();
      }
    }

    food = makeFood();
    if (food === null) {
      stop();
      $('maskTitle').textContent = '🎉 通关！';
      $('maskText').textContent  = '棋盘已被你填满，最终分数 ' + score;
      $('mask').classList.add('show');
      setState('通关');
      updateHUD();
      updateAIHUD();
      return;
    }
  } else {
    snake.pop();
    if (aiMode) aiStepsNoFood++;
  }

  updateHUD();
  updateAIHUD();
  draw();
}

/* ---------- 9. 游戏结束 ---------- */
function gameOver(reason) {
  alive = false;
  stop();
  $('maskTitle').textContent = '游戏结束';
  let extra = '';
  if (aiMode && aiEatenThisRun > 0) {
    extra = '　|　AI 本轮吃了 ' + aiEatenThisRun + ' 个';
    if (aiReachedGoal) extra += '（✅ 已达标）';
  }
  $('maskText').textContent = reason + '　|　最终分数 ' + score + '　|　吃了 ' + eaten + ' 个' + extra;
  $('mask').classList.add('show');
  setState('已结束');
  updateHUD();
  updateAIHUD();
}

/* ---------- 10. 开始 / 停止 ---------- */
function setTimerSpeed(newSpeed) {
  if (!running) return;
  clearInterval(timer);
  currentSpeed = newSpeed;
  timer = setInterval(() => {
    if (aiMode && alive && running) aiDecide();
    step();
  }, currentSpeed);
}

function start() {
  if (running || !alive) return;
  running = true;
  const interval = aiMode ? AI_SPEED : currentSpeed;
  timer = setInterval(() => {
    if (aiMode && alive && running) aiDecide();
    step();
  }, interval);
  setState(aiMode ? 'AI 自动中' : '游戏中');
}

function stop() {
  running = false;
  clearInterval(timer);
}

/* ---------- 11. 刷新面板 ---------- */
function updateHUD() {
  $('score').textContent = score;
  $('eaten').textContent = eaten;
  $('len').textContent   = snake.length;
  $('best').textContent  = best;
  $('speed').textContent = (aiMode ? AI_SPEED : currentSpeed) + 'ms';
}

function updateAIHUD() {
  $('aiEaten').textContent = aiEatenThisRun;
  $('aiTarget').textContent = AI_TARGET;
  const pct = Math.min(100, Math.round((aiEatenThisRun / AI_TARGET) * 100));
  $('aiBar').style.width = pct + '%';
  if (aiReachedGoal) {
    $('aiDone').textContent = '✅ AI 已完成 ' + AI_TARGET + ' 个目标！继续自动运行中...';
  } else if (aiMode && aiStepsNoFood >= AI_STARVE_LIMIT * 0.6) {
    // 饥饿接近阈值时给出警告（60% 起预警）
    const remain = AI_STARVE_LIMIT - aiStepsNoFood;
    $('aiDone').textContent = '⚠ 已 ' + aiStepsNoFood + ' 步未进食，' + (remain > 0 ? '再 ' + remain + ' 步将强制冲刺' : '🔥 饥饿模式：强制冲刺吃食物！');
    $('aiDone').style.color = aiStepsNoFood >= AI_STARVE_LIMIT ? '#f87171' : '#fbbf24';
  } else {
    $('aiDone').textContent = '';
    $('aiDone').style.color = '#fbbf24';
  }
}

function setState(s) { $('state').textContent = s; }

/* ==========================================================================
   ====== 阶段二：AI 自动寻路模块 ======
   ========================================================================== */

/* ---------- A1. BFS 最短路径 ---------- */
// 参数 obstacles: Set 类型，包含不可走的格子（蛇身）
// 返回: 最短路径数组 [start, ..., target]，若不可达返回 null
function bfs(start, target, obstacles) {
  const queue = [[start]];
  let head = 0;
  const visited = new Set([key(start)]);

  const DIRS = [{ x:1,y:0 }, { x:-1,y:0 }, { x:0,y:1 }, { x:0,y:-1 }];

  while (head < queue.length) {
    const path = queue[head++];
    const current = path[path.length - 1];

    if (eq(current, target)) return path;

    for (const d of DIRS) {
      const n = { x: current.x + d.x, y: current.y + d.y };
      const nk = key(n);
      if (inside(n) && !visited.has(nk) && !obstacles.has(nk)) {
        visited.add(nk);
        queue.push([...path, n]);
      }
    }
  }
  return null;
}

/* ---------- A2. 根据相邻两点反推方向 ---------- */
function getDirection(from, to) {
  return { x: Math.sign(to.x - from.x), y: Math.sign(to.y - from.y) };
}

/* ---------- A3. 安全性检查（双档位） ---------- */
// isPathSafe:      严格模式 —— 模拟吃食物后，蛇头必须能 BFS 走到蛇尾
// isPathSafeLenient: 宽松模式 —— 洪水填充，可达空格 ≥ 蛇身 × 30%，且 ≥ 2 逃生路
// 严格模式保证短~中蛇不冒险；宽松模式给高蛇长时打破死锁一个"软着陆"

function countReachable(start, obstacles) {
  const visited = new Set([key(start)]);
  const queue = [start];
  let headIdx = 0;
  const DIRS = [{ x:1,y:0 }, { x:-1,y:0 }, { x:0,y:1 }, { x:0,y:-1 }];
  while (headIdx < queue.length) {
    const cur = queue[headIdx++];
    for (const d of DIRS) {
      const n = { x: cur.x + d.x, y: cur.y + d.y };
      const nk = key(n);
      if (inside(n) && !visited.has(nk) && !obstacles.has(nk)) {
        visited.add(nk);
        queue.push(n);
      }
    }
  }
  return visited.size;
}

function isPathSafe(path) {
  if (!path || path.length < 2) return false;
  const vSnake = snake.map(s => ({ x: s.x, y: s.y }));
  for (let i = 1; i < path.length; i++) {
    vSnake.unshift(path[i]);
    if (i < path.length - 1) vSnake.pop();
  }
  const vHead = vSnake[0];
  const vTail = vSnake[vSnake.length - 1];
  const obstacles = new Set(vSnake.slice(1, -1).map(key));
  // 严格检查：头必须能走到尾
  return bfs(vHead, vTail, obstacles) !== null;
}

function isPathSafeLenient(path) {
  if (!path || path.length < 2) return false;
  const vSnake = snake.map(s => ({ x: s.x, y: s.y }));
  for (let i = 1; i < path.length; i++) {
    vSnake.unshift(path[i]);
    if (i < path.length - 1) vSnake.pop();
  }
  const vHead = vSnake[0];
  const vTail = vSnake[vSnake.length - 1];
  const snakeLen = vSnake.length;
  const obstacles = new Set(vSnake.slice(1).map(key));
  obstacles.delete(key(vTail));
  const reachable = countReachable(vHead, obstacles);
  const DIRS = [{ x:1,y:0 }, { x:-1,y:0 }, { x:0,y:1 }, { x:0,y:-1 }];
  let escapeRoutes = 0;
  for (const d of DIRS) {
    const n = { x: vHead.x + d.x, y: vHead.y + d.y };
    if (inside(n) && !obstacles.has(key(n))) escapeRoutes++;
  }
  // 宽松条件：可达区域 ≥ 蛇身 30%，且至少 2 条逃生路
  return reachable >= snakeLen * 0.30 && escapeRoutes >= 2;
}

/* ---------- A4. AI 决策主函数 ---------- */
// 策略优先级：
//   1. 最短路径去食物 + 严格安全检查 → 安全就吃
//   2. 最短路径不安全 → 尝试绕路：换个相邻格子再 BFS 到食物
//   3. 饥饿模式 → 用宽松检查去食物（打破死锁，但不盲目自杀）
//   4. 追尾巴保命
//   5. 任意安全方向兜底
function aiDecide() {
  if (!alive || snake.length === 0) return;

  const bodySet = new Set(snake.slice(0, -1).map(key));
  const pathToFood = bfs(snake[0], food, bodySet);

  if (pathToFood && pathToFood.length >= 2) {
    // 正常模式：严格检查
    if (aiStepsNoFood < AI_STARVE_LIMIT) {
      if (isPathSafe(pathToFood)) {
        nextDir = getDirection(snake[0], pathToFood[1]);
        return;
      }

      // —— 策略 2：绕路找更好角度 ——
      // 模拟蛇先走到邻居 n，然后从 n 出发验证去食物的路径是否安全
      const DIRS4 = [{ x:1,y:0 }, { x:-1,y:0 }, { x:0,y:1 }, { x:0,y:-1 }];
      for (const d of DIRS4) {
        const n = { x: snake[0].x + d.x, y: snake[0].y + d.y };
        if (!inside(n) || bodySet.has(key(n))) continue;
        // 模拟蛇先走到邻居 n（尾巴缩短）
        let vSnake = snake.map(s => ({ x: s.x, y: s.y }));
        vSnake.unshift({ x: n.x, y: n.y });
        vSnake.pop(); // 尾巴弹出
        // 从邻居出发 BFS 到食物
        const localObs = new Set(vSnake.slice(0, -1).map(key));
        const detourPath = bfs(n, food, localObs);
        if (detourPath && detourPath.length >= 2 && isPathSafe(detourPath)) {
          nextDir = d;
          return;
        }
      }
    }

    // 饥饿模式：用宽松检查
    if (aiStepsNoFood >= AI_STARVE_LIMIT) {
      if (isPathSafeLenient(pathToFood)) {
        nextDir = getDirection(snake[0], pathToFood[1]);
        return;
      }
      // 饥饿模式也试试绕路
      const DIRS4 = [{ x:1,y:0 }, { x:-1,y:0 }, { x:0,y:1 }, { x:0,y:-1 }];
      for (const d of DIRS4) {
        const n = { x: snake[0].x + d.x, y: snake[0].y + d.y };
        if (!inside(n) || bodySet.has(key(n))) continue;
        let vSnake = snake.map(s => ({ x: s.x, y: s.y }));
        vSnake.unshift({ x: n.x, y: n.y });
        vSnake.pop();
        const localObs = new Set(vSnake.slice(0, -1).map(key));
        const detourPath = bfs(n, food, localObs);
        if (detourPath && detourPath.length >= 2 && isPathSafeLenient(detourPath)) {
          nextDir = d;
          return;
        }
      }
      // 宽松+绕路都过不去 → 放弃，追尾
    }
  }

  // —— 策略 4：追尾巴保命 ——
  const tail = snake[snake.length - 1];
  const allBody = new Set(snake.map(key));
  allBody.delete(key(tail));
  const pathToTail = bfs(snake[0], tail, allBody);

  if (pathToTail && pathToTail.length >= 2) {
    nextDir = getDirection(snake[0], pathToTail[1]);
    return;
  }

  // —— 策略 5：任意安全方向兜底 ——
  const DIRS = [{ x:1,y:0 }, { x:-1,y:0 }, { x:0,y:1 }, { x:0,y:-1 }];
  const bodyObstacles = new Set(snake.slice(0, -1).map(key));
  for (const d of DIRS) {
    const n = { x: snake[0].x + d.x, y: snake[0].y + d.y };
    if (inside(n) && !bodyObstacles.has(key(n))) {
      nextDir = d;
      return;
    }
  }
  // 无路可走，保持当前方向（撞墙/撞自己会在 step() 里判定）
}

/* ==========================================================================
   ====== 阶段二结束：AI 模块完毕 ======
   ========================================================================== */

/* ---------- 12. 按钮事件 ---------- */
function setDifficulty(diff) {
  if (aiMode || running) return; // AI 模式或游戏中不允许切换难度
  currentDiff = diff;
  // 更新按钮状态
  document.querySelectorAll('.diff-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.diff === diff);
  });
  // 已死亡时切换难度自动重置
  if (!alive) reset();
  else {
    // 活着的状态：更新速度和最高分
    currentSpeed = DIFFICULTY[diff].speed;
    best = Number(localStorage.getItem('snake_best_' + diff) || 0);
    generateObstacles();
    updateHUD();
    draw();
  }
}

document.querySelectorAll('.diff-btn').forEach(btn => {
  btn.onclick = () => setDifficulty(btn.dataset.diff);
});

$('btnStart').onclick = () => {
  if (!alive) { reset(); start(); return; }
  if (running) { stop(); setState('已暂停'); }
  else         { start(); }
};

$('btnReset').onclick = () => { reset(); };

$('btnAI').onclick = () => {
  aiMode = !aiMode;
  const btn = $('btnAI');

  if (aiMode) {
    btn.textContent = '🤖 AI 运行中（点击关闭）';
    btn.classList.add('active');
    // 锁定难度按钮
    document.querySelectorAll('.diff-btn').forEach(b => b.classList.add('disabled'));
    reset();
    start();
  } else {
    btn.textContent = '🤖 AI 自动演示';
    btn.classList.remove('active');
    // 解锁难度按钮
    document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('disabled'));
    reset();
  }
};

/* ---------- 13. 键盘事件 ---------- */
const KEYMAP = {
  ArrowUp:{x:0,y:-1}, ArrowDown:{x:0,y:1}, ArrowLeft:{x:-1,y:0}, ArrowRight:{x:1,y:0},
  w:{x:0,y:-1}, s:{x:0,y:1}, a:{x:-1,y:0}, d:{x:1,y:0}
};

document.addEventListener('keydown', e => {
  if (e.code === 'Space') {
    if (!alive) { reset(); start(); }
    else if (running) { stop(); setState('已暂停'); }
    else { start(); }
    e.preventDefault();
    return;
  }

  // AI 模式下禁止手动方向输入
  if (aiMode) return;

  const k = (e.key.length === 1) ? e.key.toLowerCase() : e.key;
  const nd = KEYMAP[k];
  if (!nd) return;

  if (snake.length > 1 && nd.x === -dir.x && nd.y === -dir.y) return;

  nextDir = nd;
  e.preventDefault();
});

/* ---------- 14. 启动 ---------- */
reset();
</script>
